<svg viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="200" fill="#ffffff"/>
  <!-- box 1: arrow up -->
  <rect x="20" y="50" width="90" height="90" fill="none" stroke="#ccc" stroke-width="2"/>
  <line x1="65" y1="115" x2="65" y2="65" stroke="#1a1a1a" stroke-width="6"/>
  <polygon points="65,55 50,80 80,80" fill="#1a1a1a"/>

  <text x="140" y="105" font-size="28" text-anchor="middle" fill="#555">&#8594;</text>

  <!-- box 2: arrow right -->
  <rect x="170" y="50" width="90" height="90" fill="none" stroke="#ccc" stroke-width="2"/>
  <line x1="200" y1="95" x2="250" y2="95" stroke="#1a1a1a" stroke-width="6"/>
  <polygon points="260,95 235,80 235,110" fill="#1a1a1a"/>

  <text x="290" y="105" font-size="28" text-anchor="middle" fill="#555">&#8594;</text>

  <!-- box 3: arrow down -->
  <rect x="320" y="50" width="90" height="90" fill="none" stroke="#ccc" stroke-width="2"/>
  <line x1="365" y1="65" x2="365" y2="115" stroke="#1a1a1a" stroke-width="6"/>
  <polygon points="365,125 350,100 380,100" fill="#1a1a1a"/>

  <text x="440" y="105" font-size="28" text-anchor="middle" fill="#555">&#8594;</text>

  <!-- box 4: blank -->
  <rect x="470" y="50" width="90" height="90" fill="none" stroke="#f97316" stroke-width="4" stroke-dasharray="8,6"/>
  <text x="515" y="112" font-size="34" text-anchor="middle" fill="#f97316" font-family="Arial, sans-serif" font-weight="bold">?</text>
</svg>
